services:
  workspace-init:
    image: ${M3_REHEARSAL_IMAGE:?M3_REHEARSAL_IMAGE_required}
    volumes:
      - ./tests/m3_rehearsal:/m3-rehearsal:ro

  bridge:
    image: ${M3_REHEARSAL_IMAGE:?M3_REHEARSAL_IMAGE_required}
    environment:
      PYTHONPATH: "/m3-rehearsal:/app"
      CYBERSENTINEL_M3_REHEARSAL: "1"
      CYBERSENTINEL_M3_STATE_ROOT: "/var/lib/cybersentinel"
      CYBERSENTINEL_M3_LEASE_SECONDS: "5"
      CYBERSENTINEL_M3_CRASH_WAIT_SECONDS: "45"
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LOCAL_LLM_BASE_URL: ""
      LOCAL_LLM_MODEL: ""
      COLAB_LLM_BASE_URL: ""
      COLAB_LLM_MODEL: ""
      HF_LLM_BASE_URL: ""
      HF_LLM_MODEL: ""
    volumes:
      - ./tests/m3_rehearsal:/m3-rehearsal:ro

  mission-worker:
    image: ${M3_REHEARSAL_IMAGE:?M3_REHEARSAL_IMAGE_required}
    restart: "no"
    environment:
      PYTHONPATH: "/m3-rehearsal:/app"
      CYBERSENTINEL_M3_REHEARSAL: "1"
      CYBERSENTINEL_M3_STATE_ROOT: "/var/lib/cybersentinel"
      CYBERSENTINEL_M3_LEASE_SECONDS: "5"
      CYBERSENTINEL_M3_CRASH_WAIT_SECONDS: "45"
      LLM_BASE_URL: ""
      LLM_MODEL: ""
      LOCAL_LLM_BASE_URL: ""
      LOCAL_LLM_MODEL: ""
      COLAB_LLM_BASE_URL: ""
      COLAB_LLM_MODEL: ""
      HF_LLM_BASE_URL: ""
      HF_LLM_MODEL: ""
    volumes:
      - ./tests/m3_rehearsal:/m3-rehearsal:ro
