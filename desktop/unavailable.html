<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberSentinel — تعذر بدء التطبيق</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0f14; color: #d7e0ea; font-family: "Segoe UI", Tahoma, sans-serif; }
  .panel { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 22px; color: #7dd3fc; margin: 0 0 12px; }
  p { line-height: 1.9; font-size: 15px; color: #b9c4cf; }
  .hint { color: #8b98a5; font-size: 12px; overflow-wrap: anywhere; }
  button { margin-top: 16px; padding: 11px 22px; font-size: 14px; color: #04121d; background: #22d3ee; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { background: #67e8f9; }
</style>
</head>
<body>
<main class="panel">
  <h1>تعذّر بدء CyberSentinel</h1>
  <p id="reason">لم يصبح مكوّن التطبيق المحلي جاهزًا ضمن المهلة. لم تُعرض بيانات بديلة.</p>
  <p>أعد المحاولة. إذا استمرت المشكلة، أغلق التطبيق ثم استخدم إصلاح/إعادة تثبيت من نسخة Installer موثوقة. لا يلزم تشغيل أوامر أو تثبيت أدوات إضافية.</p>
  <p class="hint">رمز التشخيص المحلي: <span id="detail"></span></p>
  <button id="retry" type="button">إعادة المحاولة</button>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  const reason = params.get("reason") || "backend-unavailable";
  const detail = params.get("detail") || "";
  const messages = {
    "backend-unavailable": "لم يصبح مكوّن التطبيق المحلي جاهزًا ضمن المهلة.",
    "backend-exited": "توقف مكوّن التطبيق المحلي أثناء التشغيل.",
    "backend-start-failed": "تعذر تشغيل مكوّن التطبيق المضمّن.",
    "developer-repository-missing": "تعذر العثور على مصدر التطبيق في وضع التطوير.",
  };
  document.getElementById("reason").textContent = messages[reason] || messages["backend-unavailable"];
  document.getElementById("detail").textContent = reason + (detail ? " / " + detail : "");
  document.getElementById("retry").addEventListener("click", () => {
    if (window.cybersentinelDesktop && typeof window.cybersentinelDesktop.retry === "function") {
      window.cybersentinelDesktop.retry();
    }
  });
</script>
</body>
</html>
