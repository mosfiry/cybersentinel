name: pytest-diagnostics

on:
  push:
    branches: [security/owner-password-auth-migration]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip install
        run: python -m pip install -r requirements.txt
      - name: pytest
        run: |
          set +e
          python -m pytest -q > pytest_out.txt 2>&1
          code=$?
          grep -E '^(FAILED|ERROR)' pytest_out.txt | head -20 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-220)"
          done
          tail -60 pytest_out.txt
          if [ "$code" -ne 0 ]; then
            mkdir -p diagnostics
            { echo "# CI run ${GITHUB_SHA:0:12}"; echo "result: FAILURE"; echo; grep -E '^(FAILED|ERROR)' pytest_out.txt | head -60; echo; tail -c 6000 pytest_out.txt; } > "diagnostics/ci-${GITHUB_SHA:0:12}.md"
            git config user.name "mosfiry"
            git config user.email "msfiry36@gmail.com"
            git add diagnostics/
            git commit -m "ci diagnostics: pytest failure ${GITHUB_SHA:0:12}" || echo "nothing to commit"
            git push || echo "push failed"
          fi
          exit $code
