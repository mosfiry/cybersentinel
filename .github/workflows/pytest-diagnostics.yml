name: pytest-diagnostics

on:
  push:
    branches: [security/owner-password-auth-migration]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Export exact file contents from main (integrity channel)
        shell: bash
        run: |
          mkdir -p diagnostics
          git fetch origin main
          sha="${GITHUB_SHA:0:12}"
          git show origin/main:core/db.py | base64 -w0 > "diagnostics/b64-main-core-db.py-${sha}.txt"
          git show origin/main:bridge.py | base64 -w0 > "diagnostics/b64-main-bridge.py-${sha}.txt"
          git show origin/main:.github/workflows/tests.yml | base64 -w0 > "diagnostics/b64-main-tests.yml-${sha}.txt"
          git config user.name "mosfiry"
          git config user.email "msfiry36@gmail.com"
          git add diagnostics/
          git commit -m "ci diagnostics: exact main file export ${sha}" || echo "nothing to commit"
          git push || echo "push failed"
      - name: pip install
        run: python -m pip install -r requirements.txt
      - name: pytest
        run: |
          set +e
          python -m pytest -q > pytest_out.txt 2>&1
          code=$?
          grep -E '^(FAILED|ERROR)' pytest_out.txt | head -20 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-220)"
          done
          tail -40 pytest_out.txt
          if [ "$code" -ne 0 ]; then
            sha="${GITHUB_SHA:0:12}"
            { echo "# CI run ${sha}"; echo "result: FAILURE"; echo; grep -E '^(FAILED|ERROR)' pytest_out.txt | head -60; echo; tail -c 4000 pytest_out.txt; } > "diagnostics/ci-${sha}.md"
            git config user.name "mosfiry"
            git config user.email "msfiry36@gmail.com"
            git add diagnostics/
            git commit -m "ci diagnostics: pytest failure ${sha}" || echo "nothing to commit"
            git push || echo "push failed"
          fi
          exit $code
