name: pytest-diagnostics

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'diagnostics/**'

concurrency:
  group: pytest-diagnostics-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
      - name: Check whitespace
        run: git diff --check
      - name: Secret and sensitive-file scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|.*_state\.json$|.*\.db$|.*\.sqlite(3)?$)' > sens_out.txt; then
            echo "Sensitive file tracked by git:" >&2
            cat sens_out.txt >&2
            exit 1
          fi
          if MATCHES=$(git grep -n -I -E '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' -- ':!*.example'); then
            echo "Secret-scan match:" >&2
            echo "$MATCHES" >&2
            exit 1
          fi
      - name: Write run summary
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Branch test result: ${JOB_RESULT}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Detailed output: see this run's failed-step logs."
          } >> "$GITHUB_STEP_SUMMARY"
