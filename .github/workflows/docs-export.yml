name: docs-export

on:
  push:
    branches: [security/owner-password-auth-migration]
    paths-ignore:
      - 'diagnostics/**'

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record selected source and test hashes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Source integrity inventory"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Only file paths and SHA-256 digests are reported; source contents are not exported."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            for f in \
              tests/test_owner_charter.py \
              tests/test_owner_authority_refactor.py \
              tests/test_phase6k4_deep_hardening.py \
              tests/test_phase6k7b_mission_runtime.py \
              tests/test_v47_red_team.py \
              security/owner_policy.json \
              agent/mission_worker.py; do
              if [ -f "$f" ]; then
                digest=$(sha256sum "$f" | awk '{print $1}')
                printf '| %s | %s |\n' "$f" "$digest"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
