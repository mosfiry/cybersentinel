name: docs-export
on:
  push:
    branches: [security/owner-password-auth-migration]
    paths-ignore: ['diagnostics/**']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: comprehensive legacy-auth inventory
        run: |
          set -euo pipefail
          TAG=$(git rev-parse --short=12 HEAD)
          mkdir -p diagnostics
          {
            echo "# comprehensive legacy auth inventory (run $TAG)"
            echo "## ALL files containing lowercase owner_token identifier/string:"
            git grep -l -I 'owner_token' -- ':!diagnostics' || echo "(none)"
            echo "## files containing _issue_evidence:"
            git grep -l -I '_issue_evidence' -- ':!diagnostics' || echo "(none)"
            echo "## files containing authentication_from_session or consume_owner_challenge:"
            git grep -l -I -E 'authentication_from_session|consume_owner_challenge' -- ':!diagnostics' || echo "(none)"
            echo "## per-file owner_token line counts:"
            for f in $(git grep -l -I 'owner_token' -- ':!diagnostics' || true); do
              echo "$f: $(git grep -c 'owner_token' -- "$f")"
            done
          } > "diagnostics/legacy-auth-inventory-${TAG}.md"
      - name: publish
        run: |
          set -euo pipefail
          git config user.name "mosfiry"
          git config user.email "msfiry36@gmail.com"
          git add diagnostics || true
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "ci diagnostics: comprehensive legacy-auth inventory $(git rev-parse --short=12 HEAD)"
          git push
