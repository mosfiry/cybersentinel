name: docs-export

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package living documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs-output
          tar -czf "docs-output/cybersentinel-docs-${GITHUB_SHA:0:12}.tar.gz" README.md docs/
          sha256sum docs-output/*.tar.gz > docs-output/SHA256SUMS
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybersentinel-docs-${{ github.run_id }}
          path: docs-output/
          if-no-files-found: error
          retention-days: 14
