name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: pip install
        run: |
          set +e
          python -m pip install -r requirements.txt > pip_out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            { echo "## pip install failed (exit $code)"; tail -c 2000 pip_out.txt; } >> diag.txt
            exit 1
          fi
      - name: compileall
        run: |
          set -o pipefail
          python -m compileall -q . 2>&1 | tee compile_out.txt
      - name: pytest
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest_out.txt
      - name: Commit-range whitespace check
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null 2>&1; then
              BASE="$BEFORE"
            else
              BASE=$(git rev-parse --quiet --verify "HEAD~1^{commit}" 2>/dev/null || echo "")
            fi
          fi
          if [ -n "$BASE" ]; then
            git diff --check "$BASE" "$GITHUB_SHA" > diff_out.txt 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              { echo "## commit-range whitespace check failed (range $BASE..$GITHUB_SHA, exit $code)"; cat diff_out.txt; } >> diag.txt
              exit 1
            fi
          else
            { echo "## commit-range whitespace check skipped: no comparable base commit"; } >> diag.txt
          fi
      - name: Secret and sensitive-file scan
        shell: bash
        run: |
          set -uo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|.*_state\.json$|.*\.db$|.*\.sqlite(3)?$)' > sens_out.txt; then
            { echo "## sensitive file tracked by git:"; cat sens_out.txt; } >> diag.txt
            exit 1
          fi
          if MATCHES=$(git grep -n -I -E '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' -- ':!*.example' ':!diagnostics'); then
            { echo "## secret-scan match:"; echo "$MATCHES"; } >> diag.txt
            exit 1
          fi
      - name: Write status
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          sha="${GITHUB_SHA:0:12}"
          if [ -f diag.txt ]; then
            { echo "# CI run $sha"; echo "result: FAILURE"; echo; cat diag.txt; } > "diagnostics/ci-$sha.md"
          else
            { echo "# CI run $sha"; echo "result: SUCCESS"; } > "diagnostics/ci-$sha.md"
          fi
      - name: Publish diagnostics
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "mosfiry"
          git config user.email "msfiry36@gmail.com"
          git add diagnostics/
          git commit -m "ci status report (ci-skip-marker)" || echo "nothing to commit"
          git pull --rebase --no-edit || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
