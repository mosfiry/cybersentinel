name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        id: compile
        run: python -m compileall -q .
      - name: Run tests
        id: tests
        run: python -m pytest -q
      - name: Check patch whitespace
        id: diff
        run: git diff --check
      - name: Scan for secrets and sensitive files
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|.*_state\.json$|.*\.db$|.*\.sqlite(3)?)$'; then
            echo "A sensitive file is tracked; inspect the workflow log and remove the file from the proposed change."
            exit 1
          fi
          if git grep -q -n -I -E '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' -- ':!*.example' ':!diagnostics'; then
            echo "A secret-like pattern was found; details are intentionally not copied into diagnostics artifacts."
            exit 1
          fi
      - name: Write status report
        if: always()
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-output
          cat > ci-output/status.md <<EOF
          # CyberSentinel CI status

          - Commit: ${GITHUB_SHA}
          - Ref: ${GITHUB_REF}
          - Dependencies: ${DEPENDENCIES_OUTCOME}
          - Compile: ${COMPILE_OUTCOME}
          - Tests: ${TESTS_OUTCOME}
          - Whitespace: ${DIFF_OUTCOME}
          - Secret scan: ${SECRETS_OUTCOME}

          Full step output remains available in this Actions run. Diagnostics are uploaded as an artifact and are never committed back to a branch.
          EOF
      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybersentinel-ci-${{ github.run_id }}
          path: ci-output/status.md
          if-no-files-found: error
          retention-days: 14
