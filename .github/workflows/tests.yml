name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: pip install
        run: python -m pip install -r requirements.txt
      - name: Install rootless Linux process isolation for governed workspace tests
        id: install_bwrap
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential meson ninja-build libcap-dev pkg-config
          archive="$RUNNER_TEMP/bubblewrap-0.9.0.tar.xz"
          source_dir="$RUNNER_TEMP/bubblewrap-0.9.0"
          build_dir="$RUNNER_TEMP/bubblewrap-build"
          stage_dir="$RUNNER_TEMP/bubblewrap-stage"
          curl --fail --location --silent --show-error \
            https://github.com/containers/bubblewrap/releases/download/v0.9.0/bubblewrap-0.9.0.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            c6347eaced49ac0141996f46bba3b089e5e6ea4408bc1c43bab9f2d05dd094e1 \
            "$archive" | sha256sum --check -
          mkdir -p "$source_dir"
          tar -xJf "$archive" --strip-components=1 -C "$source_dir"
          meson setup "$build_dir" "$source_dir" \
            --prefix=/opt/bubblewrap-0.9.0 \
            -Dtests=true \
            -Dselinux=disabled \
            -Dman=disabled \
            -Dbash_completion=disabled \
            -Dzsh_completion=disabled
          meson compile -C "$build_dir"
          meson test -C "$build_dir" --print-errorlogs
          DESTDIR="$stage_dir" meson install -C "$build_dir"
          bwrap_bin="$stage_dir/opt/bubblewrap-0.9.0/bin/bwrap"
          test "$("$bwrap_bin" --version)" = "bubblewrap 0.9.0"
          "$bwrap_bin" --help | grep -Fq -- '--size BYTES'
          sudo install -m 0755 "$bwrap_bin" /usr/bin/bwrap
          test "$(/usr/bin/bwrap --version)" = "bubblewrap 0.9.0"
          cmp --silent "$bwrap_bin" /usr/bin/bwrap
          echo "$stage_dir/opt/bubblewrap-0.9.0/bin" >> "$GITHUB_PATH"
      - name: Verify rootless network-isolated execution capability
        id: rootless_preflight
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev /usr/bin/true; then
            echo "::error title=Sandbox capability unavailable::This runner cannot provide the rootless network-isolated execution required by governed workspace tests."
            exit 1
          fi
      - name: Install pinned Playwright Chromium for Browser integration tests
        id: playwright_install
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: compileall
        id: compileall
        continue-on-error: true
        run: python -m compileall -q .
      - name: pytest
        id: pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Build and smoke-test container runtime (no publish)
        id: container_smoke
        continue-on-error: true
        shell: bash
        env:
          BRIDGE_PUBLISHED_PORT: "18787"
          CYBERSENTINEL_SECRETS_DIR: "${{ runner.temp }}/cybersentinel-compose-secrets"
          COMPOSE_PROJECT_NAME: "cybersentinel-ci-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose logs --no-color || true
            fi
            docker compose down --volumes --remove-orphans || true
            sudo rm -rf -- "$CYBERSENTINEL_SECRETS_DIR" || true
          }
          trap cleanup EXIT

          python - <<'PY'
          import os
          import secrets
          from pathlib import Path

          directory = Path(os.environ["CYBERSENTINEL_SECRETS_DIR"])
          directory.mkdir(mode=0o700, parents=True, exist_ok=True)
          values = {
              "bridge_token": secrets.token_urlsafe(48) + "\n",
              "llm_api_key": "",
              "local_llm_api_key": "",
              "colab_llm_api_key": "",
              "hf_llm_api_key": "",
          }
          for name, value in values.items():
              (directory / name).write_text(value, encoding="utf-8")
          PY
          sudo chown 10001:10001 "$CYBERSENTINEL_SECRETS_DIR"/*
          sudo chmod 0440 "$CYBERSENTINEL_SECRETS_DIR"/*
          sudo chown root:root "$CYBERSENTINEL_SECRETS_DIR"
          sudo chmod 0711 "$CYBERSENTINEL_SECRETS_DIR"

          wait_bridge() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:18787/api/health >/dev/null; then
                return 0
              fi
              sleep 2
            done
            docker compose ps
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18787/api/health
          }

          docker compose config --quiet
          docker compose build --pull
          docker compose up --detach
          wait_bridge
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18787/api/health

          python scripts/verify_container_contract.py

          current_generation() {
            docker compose exec --no-TTY bridge python -c '
          import sqlite3
          db = sqlite3.connect("/var/lib/cybersentinel/mission_queue.sqlite3")
          row = db.execute("SELECT runtime_generation,state FROM mission_worker_generations WHERE worker_id=? ORDER BY runtime_generation DESC LIMIT 1", ("cybersentinel-worker",)).fetchone()
          if row is None or row[1] != "ACTIVE":
              raise SystemExit("worker_generation_not_active")
          print(row[0])
          '
          }
          wait_generation() {
            expected=$1
            for attempt in $(seq 1 60); do
              current=$(current_generation 2>/dev/null || true)
              if [ -n "$current" ] && [ "$current" -ge "$expected" ]; then
                printf '%s\n' "$current"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          first=$(wait_generation 1)
          test "$first" = "1"
          docker compose restart mission-worker
          second=$(wait_generation 2)
          test "$second" = "2"

          # Recreate containers but preserve the isolated named state volume.
          docker compose down --remove-orphans
          docker compose up --detach
          wait_bridge
          third=$(wait_generation 3)
          test "$third" = "3"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18787/api/health
      - name: git diff check
        id: diff_check
        continue-on-error: true
        run: git diff --check
      - name: Secret and sensitive-file scan
        id: secret_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|.*_state\.json$|.*\.db$|.*\.sqlite(3)?$)' > sens_out.txt; then
            echo "Sensitive file tracked by git:" >&2
            cat sens_out.txt >&2
            exit 1
          fi
          if MATCHED_FILES=$(git grep -l -I -E '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' -- ':!*.example'); then
            echo "Secret-like pattern detected; matching file contents suppressed:" >&2
            echo "$MATCHED_FILES" >&2
            exit 1
          fi
      - name: Enforce all Linux acceptance gates
        if: always()
        shell: bash
        env:
          INSTALL_BWRAP_OUTCOME: ${{ steps.install_bwrap.outcome }}
          ROOTLESS_PREFLIGHT_OUTCOME: ${{ steps.rootless_preflight.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright_install.outcome }}
          COMPILEALL_OUTCOME: ${{ steps.compileall.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          CONTAINER_SMOKE_OUTCOME: ${{ steps.container_smoke.outcome }}
          DIFF_CHECK_OUTCOME: ${{ steps.diff_check.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
        run: |
          set -euo pipefail
          names=(install_bwrap rootless_preflight playwright_install compileall pytest container_smoke diff_check secret_scan)
          outcomes=("$INSTALL_BWRAP_OUTCOME" "$ROOTLESS_PREFLIGHT_OUTCOME" "$PLAYWRIGHT_OUTCOME" "$COMPILEALL_OUTCOME" "$PYTEST_OUTCOME" "$CONTAINER_SMOKE_OUTCOME" "$DIFF_CHECK_OUTCOME" "$SECRET_SCAN_OUTCOME")
          failed=0
          for index in "${!names[@]}"; do
            if [[ "${outcomes[$index]}" != "success" ]]; then
              echo "::error::Required Linux gate '${names[$index]}' ended as '${outcomes[$index]}'."
              failed=1
            fi
          done
          exit "$failed"
      - name: Write run summary
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## CI result: ${JOB_RESULT}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Detailed output: see this run's failed-step logs."
          } >> "$GITHUB_STEP_SUMMARY"


  m3-nonproduction-rehearsal:
    name: M3 non-production cutover rehearsal
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run isolated M3 V16 and V12 clean-install, migration, backup, and restore rehearsal
        env:
          REHEARSAL_OUTPUT: ${{ runner.temp }}/v12-clean-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -euo pipefail
          python scripts/rehearse_nonproduction_cutover.py --output "$REHEARSAL_OUTPUT"
      - name: Upload sanitized V12 stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-clean-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v12-clean-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 14


  release-artifacts:
    name: Build and verify unpublished release candidate artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/cybersentinel-final-20261003'
    runs-on: ubuntu-latest
    needs: [test, m3-nonproduction-rehearsal]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, save, package, and verify the exact-version image
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid VERSION file" >&2
            exit 2
          fi
          image_ref="cybersentinel-runtime:${version}"
          docker build --pull --tag "$image_ref" --build-arg "CYBERSENTINEL_VERSION=$version" .
          image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image_ref")"
          test "$image_version" = "$version"

          image_tar="$RUNNER_TEMP/cybersentinel-runtime-${version}.tar"
          docker save --output "$image_tar" "$image_ref"
          docker load --input "$image_tar"
          loaded_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image_ref")"
          test "$loaded_version" = "$version"

          output_dir="$RUNNER_TEMP/cybersentinel-release"
          mkdir -p "$output_dir"
          python3 scripts/package_release.py build \
            --image-tar "$image_tar" \
            --output-dir "$output_dir" \
            --commit "$SOURCE_COMMIT"
          archive="$output_dir/cybersentinel-${version}-release.tar.gz"
          python3 scripts/package_release.py verify "$archive"
          (cd "$output_dir" && sha256sum --check --strict "$(basename "$archive").sha256")
      - name: Upload unpublished candidate bundle (no GitHub Release or tag)
        uses: actions/upload-artifact@v4
        with:
          name: cybersentinel-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cybersentinel-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
