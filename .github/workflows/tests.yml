name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: compileall
        run: |
          python -m compileall -q . > compile_out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::compileall failed: $(tail -c 500 compile_out.txt | tr ':~' '__')"
            exit 1
          fi
      - name: pytest
        run: |
          python -m pytest -q > pytest_out.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest failed with code $code: $(tail -c 900 pytest_out.txt | tr ':~' '__')"
            exit 1
          fi
      - run: git diff --check
      - name: Secret and sensitive-file scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|.*\.pem$|.*\.key$|.*_state\.json$|.*\.db$|.*\.sqlite(3)?$)'; then
            echo '::error::sensitive-file tracked by git'
            exit 1
          fi
          if MATCHES=$(git grep -n -I -E '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' -- ':!*.example'); then
            echo "::error::secret-match found: ${MATCHES:0:700}" | tr ':~' '__'
            exit 1
          fi
