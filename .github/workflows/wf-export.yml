name: wf-export
on:
  push:
    branches:
      - security/owner-password-auth-migration
    paths-ignore:
      - 'diagnostics/**'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export workflow files as base64 chunks
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA:0:12}"
          mkdir -p diagnostics
          rm -f /tmp/chunk_* /tmp/whole.b64 2>/dev/null || true
          for f in .github/workflows/pytest-diagnostics.yml .github/workflows/docs-export.yml; do
            NAME=$(echo "$f" | tr '/' '-')
            rm -f diagnostics/b64-head-${NAME}-*.txt
            base64 -w 0 "$f" > /tmp/whole.b64
            split -b 30000 /tmp/whole.b64 /tmp/chunk_
            i=0
            for c in /tmp/chunk_*; do
              cp "$c" "diagnostics/b64-head-${NAME}-${TAG}.part$(printf '%02d' "$i").txt"
              i=$((i+1))
            done
            rm -f /tmp/chunk_*
          done
      - name: Publish diagnostics
        run: |
          set -euo pipefail
          git config user.name "mosfiry"
          git config user.email "msfiry36@gmail.com"
          git add diagnostics
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "ci diagnostics: workflow file export ${GITHUB_SHA:0:12}"
          git pull --rebase --autostash || true
          git push
